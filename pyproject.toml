[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-anchor"
version = "0.2.0"
description = "Compaction-aware memory layer: preserve rules/todos/decisions/progress before context compression, re-inject after. Zero dependencies, pure stdlib."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shuo Liu", email = "44334433@users.noreply.github.com" }]
keywords = ["context-compression", "memory", "llm", "agent", "compaction"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
cam = "memory_anchor.cli:main"

[project.urls]
Repository = "https://github.com/44334433/memory-anchor"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
